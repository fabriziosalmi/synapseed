[workspace]
members = [
  "crates/core",
  "crates/cortex",
  "crates/husk",
  "crates/root",
  "crates/chronos",
  "crates/mcp",
  "crates/visualizer",
  "crates/search",
  "crates/shadow-check",
  "crates/whisper",
  "crates/telemetry-sink",
  "crates/gym",
  "crates/janitor",
  "crates/architect",
  "bin/synapseed",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
authors = ["Fabrizio Salmi <fabrizio.salmi@gmail.com>"]
repository = "https://github.com/fabriziosalmi/synapseed"
version = "3.9.3"

[workspace.dependencies]
# Async Runtime
tokio = {version = "1", features = ["full"]}
tokio-util = {version = "0.7", features = ["rt"]}

# Serialization & Configuration
serde = {version = "1", features = ["derive"]}
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# AST Parsing
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"

# DLP - Ultra-fast multi-pattern matching
aho-corasick = "1"
regex = "1"

# Git integration (Time-Travel)
git2 = {version = "0.20", default-features = false, features = ["https"]}

# Concurrent data structures
dashmap = "6"

# Non-poisoning locks
parking_lot = "0.12"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter", "json"]}

# CLI
clap = {version = "4", features = ["derive"]}

# File watching
notify = "7"

# Web Server (Visualizer)
axum = {version = "0.7", features = ["ws"]}
rust-embed = "8"

# gRPC / OTLP (Telemetry Sink)
opentelemetry-proto = {version = "0.27", features = ["gen-tonic", "trace", "with-serde"]}
prost = "0.13"
tonic = "0.12"

# OpenTelemetry (Self-Instrumentation)
opentelemetry = "0.27"
opentelemetry-otlp = {version = "0.27", features = ["grpc-tonic", "trace"]}
opentelemetry_sdk = {version = "0.27", features = ["rt-tokio"]}
tracing-opentelemetry = "0.28"

# Full-Text Search
tantivy = "0.25"

# Identifiers
uuid = {version = "1", features = ["v4", "serde"]}

# Time
chrono = {version = "0.4", features = ["serde"]}

# Parallel processing
rayon = "1"

# Directory utilities
dirs = "6"

# Temp directories (Gym)
tempfile = "3"

# Property-based testing (Gym fuzzing)
proptest = "1"

# Graph algorithms (Architect)
petgraph = "0.6"

# Vector Embeddings (local ONNX inference)
fastembed = "5"
ort = "2.0.0-rc.11"

# Fast non-cryptographic hashing
fxhash = "0.2"

# Binary serialization (vector index persistence)
bincode = "1"

# Benchmarking
criterion = {version = "0.5", features = ["html_reports"]}

# Gitignore-aware file walking
ignore = "0.4"

# Internal crates
synapseed-architect = {path = "crates/architect"}
synapseed-chronos = {path = "crates/chronos"}
synapseed-core = {path = "crates/core"}
synapseed-cortex = {path = "crates/cortex"}
synapseed-gym = {path = "crates/gym"}
synapseed-husk = {path = "crates/husk"}
synapseed-janitor = {path = "crates/janitor"}
synapseed-mcp = {path = "crates/mcp"}
synapseed-root = {path = "crates/root"}
synapseed-search = {path = "crates/search"}
synapseed-shadow-check = {path = "crates/shadow-check"}
synapseed-telemetry-sink = {path = "crates/telemetry-sink"}
synapseed-visualizer = {path = "crates/visualizer"}
synapseed-whisper = {path = "crates/whisper"}

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
