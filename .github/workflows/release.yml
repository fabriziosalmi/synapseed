name: Release

on:
  push:
    tags: ["v*"]
  # Builds every target without publishing: the release job runs on tags only.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ORT_STRATEGY: download

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # Built natively on GitHub's arm64 runner. The cross build that ran
          # here before failed in the v4.30.0 release, which therefore never
          # published any binary.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p synapseed-cli

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../synapseed-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }} synapseed
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: synapseed-${{ matrix.target }}
          path: synapseed-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: CHANGELOG.md
          files: artifacts/*
