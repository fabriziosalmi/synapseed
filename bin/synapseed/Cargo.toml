[package]
description = "SYNAPSEED CLI — High-Performance Semantic AI Middleware"
edition.workspace = true
license.workspace = true
name = "synapseed-cli"
version.workspace = true

[[bin]]
name = "synapseed"
path = "src/main.rs"

[features]
default = ["vendored-openssl"]
vendored-openssl = ["git2/vendored-openssl"]

[dependencies]
anyhow = {workspace = true}
clap = {workspace = true}
git2 = {workspace = true}
parking_lot = {workspace = true}
ort = {workspace = true, features = ["copy-dylibs"]}
serde = {workspace = true}
serde_json = {workspace = true}
synapseed-architect = {workspace = true}
synapseed-chronos = {workspace = true}
synapseed-core = {workspace = true}
synapseed-cortex = {workspace = true}
synapseed-gym = {workspace = true}
synapseed-husk = {workspace = true}
synapseed-janitor = {workspace = true}
synapseed-mcp = {workspace = true, features = ["embeddings"]}
synapseed-root = {workspace = true}
synapseed-search = {workspace = true, features = ["embeddings"]}
synapseed-shadow-check = {workspace = true}
synapseed-telemetry-sink = {workspace = true, features = ["grpc"]}
synapseed-whisper = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}
