<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNAPSEED — Architecture Visualizer</title>
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    color: #58a6ff;
    letter-spacing: 2px;
  }

  header h1 span { color: #7ee787; }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .controls button {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: background 0.2s;
  }

  .controls button:hover { background: #30363d; }

  #cy {
    flex: 1;
    background: #0d1117;
  }

  footer {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    flex-shrink: 0;
  }

  .stats { display: flex; gap: 20px; }
  .stat-label { color: #8b949e; }
  .stat-value { color: #7ee787; font-weight: 600; }

  #ws-status {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f85149;
    transition: background 0.3s;
  }

  .dot.connected { background: #7ee787; }
  .dot.connecting { background: #d29922; animation: pulse-dot 1s infinite; }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #tooltip {
    position: absolute;
    background: #1c2128;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 14px;
    pointer-events: none;
    display: none;
    z-index: 100;
    max-width: 480px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    line-height: 1.6;
  }

  #tooltip .tt-name { color: #58a6ff; font-weight: 600; font-size: 16px; }
  #tooltip .tt-kind { color: #8b949e; margin-top: 4px; font-size: 14px; }
  #tooltip .tt-loc { color: #7ee787; margin-top: 6px; font-size: 14px; }

  #graph-status {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #484f58;
    font-size: 15px;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  #graph-status.error { color: #f85149; }
  #graph-status.hidden { display: none; }

  #activity-log {
    position: absolute;
    bottom: 44px;
    right: 16px;
    width: 360px;
    max-height: 280px;
    overflow-y: auto;
    background: #161b22ee;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    display: none;
  }

  #activity-log.visible { display: block; }

  .log-entry {
    padding: 3px 0;
    border-bottom: 1px solid #21262d;
    color: #8b949e;
  }

  .log-entry .log-time { color: #484f58; }
  .log-entry .log-path { color: #d2a8ff; }
  .log-entry .log-kind { color: #7ee787; }
</style>
</head>
<body>

<header>
  <h1>SYNAPSE<span>SEED</span> &mdash; Architecture Visualizer</h1>
  <div class="controls">
    <button onclick="refreshGraph()">Refresh</button>
    <button onclick="fitGraph()">Fit</button>
    <button onclick="toggleLog()">Activity</button>
  </div>
</header>

<div id="cy"></div>
<div id="graph-status">Loading graph...</div>
<div id="tooltip"></div>
<div id="activity-log"></div>

<footer>
  <div class="stats">
    <div><span class="stat-label">Files: </span><span class="stat-value" id="stat-files">—</span></div>
    <div><span class="stat-label">Symbols: </span><span class="stat-value" id="stat-symbols">—</span></div>
    <div><span class="stat-label">Events: </span><span class="stat-value" id="stat-events">0</span></div>
  </div>
  <div id="ws-status">
    <div class="dot" id="ws-dot"></div>
    <span id="ws-label">Disconnected</span>
  </div>
</footer>

<script src="/graph.js"></script>
</body>
</html>
