<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNAPSEED — Architecture Visualizer</title>
<script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ──────────────────────────────────────── */

  header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 14px;
    font-weight: 600;
    color: #58a6ff;
    letter-spacing: 2px;
    white-space: nowrap;
  }

  header h1 span { color: #7ee787; }

  #search-box {
    flex: 1;
    max-width: 320px;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search-box:focus { border-color: #58a6ff; }
  #search-box::placeholder { color: #484f58; }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: auto;
  }

  .controls button {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .controls button:hover { background: #30363d; }
  .controls button.active { background: #30363d; border-color: #58a6ff; color: #58a6ff; }

  /* ── Main Area ───────────────────────────────────── */

  #main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  #cy {
    flex: 1;
    min-width: 200px;
    background: #0d1117;
  }

  /* ── Graph Status Overlay ────────────────────────── */

  #graph-status {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #484f58;
    font-size: 14px;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }

  #graph-status.error { color: #f85149; }
  #graph-status.hidden { display: none; }

  /* ── Detail Panel (right sidebar) ────────────────── */

  #detail-panel {
    width: 320px;
    min-width: 240px;
    background: #161b22;
    border-left: 1px solid #30363d;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }

  #detail-panel.visible {
    display: flex;
  }

  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .panel-header h2 {
    font-size: 13px;
    font-weight: 600;
    color: #58a6ff;
  }

  .panel-close {
    background: none;
    border: none;
    color: #484f58;
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  .panel-close:hover { color: #c9d1d9; }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }

  .panel-section {
    margin-bottom: 16px;
  }

  .panel-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #484f58;
    margin-bottom: 4px;
  }

  .panel-value {
    font-size: 13px;
    color: #c9d1d9;
    word-break: break-all;
  }

  .panel-value.accent { color: #58a6ff; }
  .panel-value.green { color: #7ee787; }
  .panel-value.orange { color: #f0883e; }

  .panel-symbol-list {
    list-style: none;
    padding: 0;
  }

  .panel-symbol-list li {
    padding: 6px 0;
    border-bottom: 1px solid #21262d;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-symbol-list li:hover { color: #58a6ff; }

  .sym-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sym-lines {
    color: #484f58;
    font-size: 11px;
    margin-left: auto;
  }

  /* ── Hover Tooltip ───────────────────────────────── */

  #tooltip {
    position: absolute;
    background: #1c2128;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    pointer-events: none;
    display: none;
    z-index: 100;
    max-width: 420px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    line-height: 1.5;
  }

  #tooltip .tt-name { color: #58a6ff; font-weight: 600; font-size: 15px; }
  #tooltip .tt-kind { color: #8b949e; margin-top: 3px; font-size: 13px; }
  #tooltip .tt-loc { color: #7ee787; margin-top: 4px; font-size: 13px; }

  /* ── Activity Log ────────────────────────────────── */

  #activity-log {
    position: absolute;
    bottom: 44px;
    right: 16px;
    width: 340px;
    max-height: 260px;
    overflow-y: auto;
    background: #161b22ee;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
    display: none;
    z-index: 50;
  }

  #activity-log.visible { display: block; }

  .log-entry {
    padding: 3px 0;
    border-bottom: 1px solid #21262d;
    color: #8b949e;
  }

  .log-entry .log-time { color: #484f58; }
  .log-entry .log-path { color: #d2a8ff; }
  .log-entry .log-kind { color: #7ee787; }

  /* ── Footer ──────────────────────────────────────── */

  footer {
    background: #161b22;
    border-top: 1px solid #30363d;
    padding: 7px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    flex-shrink: 0;
  }

  .stats { display: flex; gap: 16px; }
  .stat-label { color: #8b949e; }
  .stat-value { color: #7ee787; font-weight: 600; }

  #ws-status {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f85149;
    transition: background 0.3s;
  }

  .dot.connected { background: #7ee787; }
  .dot.connecting { background: #d29922; animation: pulse-dot 1s infinite; }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Responsive ──────────────────────────────────── */

  @media (max-width: 700px) {
    header h1 { display: none; }
    #search-box { max-width: none; }
    #detail-panel { width: 260px; min-width: 200px; }
    .controls button span.btn-label { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>SYNAPSE<span>SEED</span></h1>
  <input id="search-box" type="text" placeholder="Search files, symbols..." autocomplete="off" spellcheck="false">
  <div class="controls">
    <button onclick="refreshGraph()" title="Reload graph data">Refresh</button>
    <button onclick="fitGraph()" title="Fit graph to viewport">Fit</button>
    <button id="btn-activity" onclick="toggleLog()" title="Toggle activity log">Activity</button>
  </div>
</header>

<div id="main-area">
  <div id="cy"></div>
  <div id="graph-status">Loading graph...</div>
  <div id="tooltip"></div>
  <div id="activity-log"></div>

  <div id="detail-panel">
    <div class="panel-header">
      <h2 id="panel-title">Details</h2>
      <button class="panel-close" onclick="closePanel()" title="Close">&times;</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>

<footer>
  <div class="stats">
    <div><span class="stat-label">Files </span><span class="stat-value" id="stat-files">—</span></div>
    <div><span class="stat-label">Symbols </span><span class="stat-value" id="stat-symbols">—</span></div>
    <div><span class="stat-label">Events </span><span class="stat-value" id="stat-events">0</span></div>
  </div>
  <div id="ws-status">
    <div class="dot" id="ws-dot"></div>
    <span id="ws-label">Disconnected</span>
  </div>
</footer>

<script src="/graph.js"></script>
</body>
</html>
